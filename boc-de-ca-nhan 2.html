<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bốc Đề Claude Code</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mut:#7a7068;--line:#e8e0d6;--acc:#d97757;--acc2:#b85c3e;--soft:#fbeee8;--code:#2b2622;--codeink:#f6efe8;--dsoft:#e9eef9;--dink:#3d5a9e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#2a2622;--ink:#f1ece6;--mut:#a89e94;--line:#3d3731;--acc:#e8896a;--acc2:#f0a088;--soft:#3a2a23;--code:#141210;--dsoft:#232c40;--dink:#9db4e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header h1 span{color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:var(--acc2)}
button.big{padding:16px 36px;font-size:20px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.hint{color:var(--mut);font-size:14px}
.hero{text-align:center;padding:56px 20px}
.hero .dice{font-size:64px;line-height:1}
.hero h2{margin:12px 0 6px;font-size:26px}
.hero p{color:var(--mut);margin:0 0 28px}
.slot{font-size:30px;font-weight:800;min-height:48px;color:var(--acc);margin:8px 0 4px;word-break:break-word}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;padding:2px 14px;border-radius:10px;background:var(--soft);color:var(--acc2)}
.timer.low{color:#d33;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.topic{border-left:6px solid var(--acc)}
.ch-title{font-size:24px;font-weight:700;margin:2px 0 6px}
.ch-title .emo{font-size:32px;margin-right:8px}
h3{margin:18px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
ul.req{margin:0;padding-left:22px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--bg)}
.step b{color:var(--acc2)}
.tip{font-size:14px;color:var(--mut);margin:2px 0 6px}
.prompt{position:relative;background:var(--code);color:var(--codeink);border-radius:8px;padding:10px 70px 10px 12px;font:14px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.prompt button{position:absolute;top:6px;right:6px;padding:3px 9px;font-size:12px}
.phase{margin:22px 0 4px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:8px;display:inline-block}
.phase.design{background:var(--dsoft);color:var(--dink)}
.phase.build{background:var(--soft);color:var(--acc2)}
.step.design{border-left:4px solid var(--dink)}
.step.design b{color:var(--dink)}
.step.build{border-left:4px solid var(--acc)}
details summary{cursor:pointer;font-weight:600;color:var(--acc2)}
.pop{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.hidden{display:none!important}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
@media(max-width:480px){.timer{font-size:24px}.ch-title{font-size:20px}.slot{font-size:24px}}
</style>
</head>
<body>
<header>
  <h1>🎲 Bốc đề <span>Claude Code</span></h1>
  <div class="hint">Mỗi người 1 app · Vẽ trước, xây sau · 15 phút</div>
</header>
<main>

<section id="start" class="card hero">
  <div class="dice">🎲</div>
  <h2>Sẵn sàng nhận đề chưa?</h2>
  <p>Bấm nút bên dưới, máy sẽ chọn ngẫu nhiên cho bạn 1 trong 16 đề.</p>
  <button class="pri big" id="go">🎲 Chọn chủ đề</button>
</section>

<section id="drawing" class="card hero hidden">
  <div class="hint" id="drawLabel">Đang chọn đề cho bạn...</div>
  <div class="slot" id="slot">?</div>
</section>

<section id="result" class="hidden">
  <div class="bar">
    <div class="timer" id="timer">15:00</div>
    <button class="pri" id="tStart">▶ Bắt đầu</button>
    <button id="tReset">↺ Reset</button>
    <div class="spacer"></div>
    <button id="reroll">🎲 Đổi đề khác</button>
    <button id="copyAll">📋 Copy đề</button>
  </div>
  <div id="topic"></div>
</section>

</main>
<footer>Kho đề: 16 app nhỏ</footer>

// Luồng "vẽ trước, xây sau": 2 bước Design rồi các bước Claude Code
function steps(i){
  const c=C[i],u=U[i],last=c.s[c.s.length-1];
  return [
    {ph:"design",t:"Vẽ giao diện",tip:"Mở Design, tạo bản thiết kế mới rồi dán prompt",
     p:`Thiết kế giao diện cho app "${c.n}": ${c.d}\nBố cục: ${u.u}.\nPhong cách hiện đại, sạch sẽ, chữ tiếng Việt. Vẽ cả bản máy tính và điện thoại.`},
    {ph:"design",t:"Chỉnh bản vẽ cho ưng",tip:"Sửa trên bản vẽ nhanh hơn sửa code rất nhiều, hãy chỉnh đến khi ưng",
     p:`${u.v}.`},
    {ph:"build",t:"Chuyển bản vẽ sang Claude Code",tip:"Gửi bản design sang Claude Code (hoặc chụp màn hình và kéo vào), bấm Shift+Tab để vào Plan mode",
     p:`Đây là bản thiết kế app "${c.n}". Hãy lập kế hoạch dựng nó thành 1 file index.html thuần HTML/CSS/JS, giữ đúng bố cục, màu sắc và khoảng cách như bản vẽ. Chưa viết code.`},
    {ph:"build",t:"Xây tính năng",tip:"Duyệt plan để Claude bắt đầu code",
     p:`Ok, hãy làm theo kế hoạch. Tính năng cần có:\n${c.r.map(x=>'- '+x).join('\n')}`},
    {ph:"build",t:"So với bản vẽ & sửa",tip:"Mở index.html trong trình duyệt, đặt cạnh bản design để so",
     p:`Hãy so sánh index.html với bản thiết kế, liệt kê những chỗ lệch (bố cục, màu, cỡ chữ, khoảng cách) và sửa cho khớp. Ngoài ra tôi thấy: [mô tả lỗi nếu có].`},
    {ph:"build",t:last[0],tip:last[1],p:last[2]}
  ];
}
const PH={design:"① Vẽ trước · Design",build:"② Xây sau · Claude Code"};

// ============ TIỆN ÍCH ============
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
let state={ch:null};
function show(id){['start','drawing','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}

// ============ BỐC ĐỀ ============
function draw(final){
  show('drawing');
  return new Promise(res=>{
    const slot=$('#slot'),lab=$('#drawLabel');
    lab.textContent='Đang chọn đề cho bạn...';
    let n=0,delay=60;
    const tick=()=>{
      const c=n<24?pick(C):C[final];
      slot.textContent=c.e+' '+c.n;
      if(n++<24){delay+=n>16?25:0;setTimeout(tick,delay)}
      else{lab.textContent='Đề của bạn là:';slot.classList.add('pop');setTimeout(()=>{slot.classList.remove('pop');res()},900)}
    };
    tick();
  });
}
async function choose(exclude){
  const pool=C.map((_,i)=>i).filter(i=>i!==exclude);
  state.ch=pick(pool);
  await draw(state.ch);
  render();show('result');
}
$('#go').onclick=()=>choose(null);
$('#reroll').onclick=()=>{if(confirm('Đổi sang một đề khác?')){stopTimer();choose(state.ch)}};

// ============ HIỂN THỊ ============
function topicText(i){
  const c=C[i],st=steps(i);let ph='';
  return `ĐỀ: ${c.e} ${c.n}\n${c.d}\n\nYÊU CẦU:\n${c.r.map(x=>'- '+x).join('\n')}\n\nCÁC BƯỚC:\n${st.map((s,j)=>{const h=s.ph!==ph?`\n${PH[ph=s.ph]}\n`:'';return `${h}${j+1}. ${s.t} (${s.tip})\n   Prompt: ${s.p}`}).join('\n')}\n\nThử thách thêm: ${c.b}`;
}
function render(){
  const c=C[state.ch],st=steps(state.ch);let ph='';
  $('#topic').innerHTML=`<article class="card topic pop">
    <div class="ch-title"><span class="emo">${c.e}</span>${esc(c.n)}</div>
    <div>${esc(c.d)}</div>
    <h3>Yêu cầu</h3>
    <ul class="req">${c.r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${st.map((s,j)=>`${s.ph!==ph?`<div class="phase ${ph=s.ph}">${PH[s.ph]}</div>`:''}<div class="step ${s.ph}"><b>Bước ${j+1}: ${esc(s.t)}</b>
      <div class="tip">💡 ${esc(s.tip)}</div>
      <div class="prompt"><button data-copy="${j}">Copy</button>${esc(s.p)}</div></div>`).join('')}
    <details><summary>⭐ Thử thách thêm (nếu còn thời gian)</summary><p>${esc(c.b)}</p></details>
  </article>`;
}
function flash(b){const o=b.textContent;b.textContent='Đã copy ✓';setTimeout(()=>b.textContent=o,1200)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-copy]');if(!b)return;
  navigator.clipboard.writeText(steps(state.ch)[+b.dataset.copy].p).then(()=>flash(b),()=>{});
});
$('#copyAll').onclick=function(){navigator.clipboard.writeText(topicText(state.ch)).then(()=>flash(this),()=>{})};

// ============ ĐỒNG HỒ ============
const MIN=15;
let left=MIN*60,iv=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paint(){const t=$('#timer');t.textContent=fmt(left);t.classList.toggle('low',left<=60&&left>0)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},700)}catch(e){}}
function stopTimer(){clearInterval(iv);iv=null;$('#tStart').textContent='▶ Bắt đầu'}
$('#tStart').onclick=()=>{
  if(iv){stopTimer();$('#tStart').textContent='▶ Tiếp tục';return}
  if(left<=0)left=MIN*60;
  $('#tStart').textContent='⏸ Tạm dừng';
  iv=setInterval(()=>{left--;paint();if(left<=0){stopTimer();beep();document.title='⏰ Hết giờ!'}},1000);
};
$('#tReset').onclick=()=>{stopTimer();left=MIN*60;paint();document.title='Bốc Đề Claude Code'};
paint();

</script>
